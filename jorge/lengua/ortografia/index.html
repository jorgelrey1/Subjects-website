<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Caza-errores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:wght@600;700&display=swap">
<style>
/* Concepto: cuaderno de clase con boli rojo de profe. Tipografía de máxima legibilidad (Atkinson Hyperlegible) para el texto del examen; el rojo marca las faltas y el verde la forma correcta. */
:root {
  --paper: #f3f5fa;
  --surface: #ffffff;
  --surface-2: #eef1f8;
  --ink: #14203b;
  --muted: #55627c;
  --line: #d9dfec;
  --accent: #1f4fd6;
  --accent-ink: #ffffff;
  --accent-soft: #e3eaff;
  --pen: #c2202f;
  --pen-soft: #fde7ea;
  --ok: #17784a;
  --ok-soft: #dff3e8;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-display: "Bricolage Grotesque", "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1426;
    --surface: #161e36;
    --surface-2: #1d2744;
    --ink: #e9eeff;
    --muted: #9fabc7;
    --line: #2b3759;
    --accent: #86a8ff;
    --accent-ink: #0b1122;
    --accent-soft: #223062;
    --pen: #ff8792;
    --pen-soft: #3b1d28;
    --ok: #65d79c;
    --ok-soft: #173a2b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1426;
  --surface: #161e36;
  --surface-2: #1d2744;
  --ink: #e9eeff;
  --muted: #9fabc7;
  --line: #2b3759;
  --accent: #86a8ff;
  --accent-ink: #0b1122;
  --accent-soft: #223062;
  --pen: #ff8792;
  --pen-soft: #3b1d28;
  --ok: #65d79c;
  --ok-soft: #173a2b;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 1.0625rem;
  line-height: 1.55;
  padding-inline: 16px;
}
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; text-wrap: balance; margin: 0; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1:focus { outline: none; }

.wrap { max-width: 62rem; margin-inline: auto; padding-block: 1.75rem 4rem; }

/* Botones */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
  min-height: 2.9rem; padding: .6rem 1.2rem;
  border-radius: 999px; border: 2px solid var(--accent);
  background: var(--accent); color: var(--accent-ink);
  font-weight: 700; text-decoration: none;
  transition: transform .12s ease, background-color .12s ease;
}
.btn:hover { transform: translateY(-1px); }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.big { min-height: 3.4rem; padding-inline: 1.7rem; font-size: 1.15rem; }
.link {
  background: none; border: 0; padding: .35rem .1rem; color: var(--accent);
  font-weight: 700; text-decoration: underline; text-underline-offset: 3px;
}

/* ===== Índice ===== */
.hero { display: grid; gap: .9rem; margin-bottom: 1.6rem; }
.hero h1 { font-size: clamp(2.2rem, 7vw, 3.4rem); letter-spacing: -.01em; }
.hero h1 .pen { text-decoration: underline wavy var(--pen); text-decoration-thickness: .07em; text-underline-offset: .14em; }
.hero .lede { max-width: 42rem; color: var(--muted); font-size: 1.15rem; }

.steps { list-style: none; margin: 0 0 1.8rem; padding: 0; display: grid; gap: .75rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 12.5rem), 1fr)); counter-reset: paso; }
.steps li {
  counter-increment: paso; position: relative;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: .9rem 1rem .9rem 3.1rem; min-width: 0;
}
.steps li::before {
  content: counter(paso); position: absolute; left: .85rem; top: .8rem;
  width: 1.7rem; height: 1.7rem; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--accent-soft); color: var(--accent); font: 700 .95rem var(--font-display);
}

.summary { display: flex; flex-wrap: wrap; gap: .5rem 1.2rem; align-items: baseline; margin-bottom: 1rem; color: var(--muted); }
.summary strong { color: var(--ink); font-family: var(--font-display); font-size: 1.15rem; }

.grid { list-style: none; margin: 0; padding: 0; display: grid; gap: .9rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 19rem), 1fr)); }
.card {
  width: 100%; height: 100%; text-align: left; min-width: 0;
  display: grid; grid-template-columns: auto 1fr; gap: .2rem 1rem; align-content: start;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 1rem 1.1rem 1.05rem;
  transition: border-color .12s ease, transform .12s ease;
}
.card:hover { border-color: var(--accent); transform: translateY(-2px); }
.card .num { grid-row: 1 / span 3; font: 700 2.6rem/1 var(--font-display); color: var(--accent); min-width: 2ch; }
.card .titulo { font: 700 1.25rem/1.15 var(--font-display); }
.card .tema { color: var(--muted); }
.card .meta { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem .8rem; margin-top: .45rem; font-size: .95rem; }
.level { display: inline-flex; align-items: center; gap: .35rem; font-weight: 700; }
.dots { display: inline-flex; gap: 3px; }
.dots i { width: .6rem; height: .6rem; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--accent); }
.card .last { grid-column: 2; margin-top: .55rem; font-size: .95rem; color: var(--muted); }
.card .last.done { color: var(--ok); font-weight: 700; }
.bar-track { display: block; height: .5rem; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar-fill { height: 100%; background: var(--ok); border-radius: 99px; width: 0; }
.card .bar-track { margin-top: .3rem; }

/* ===== Cabeceras de examen ===== */
.topline { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .5rem 1rem; margin-bottom: 1rem; }
.exam-head { display: grid; gap: .4rem; margin-bottom: 1.1rem; }
.exam-head .kicker { color: var(--muted); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: .85rem; }
.exam-head h1 { font-size: clamp(1.8rem, 5.5vw, 2.6rem); }
.chip { display: inline-block; padding: .15rem .7rem; border-radius: 99px; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: .95rem; }

/* Hoja de examen */
.sheet {
  position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 1.5rem 1.4rem 1.4rem 3.2rem;
}
.sheet::before { content: ""; position: absolute; top: 0; bottom: 0; left: 2.1rem; width: 2px; background: var(--pen); opacity: .4; }
.sheet p { font-size: clamp(1.15rem, 2.2vw + .7rem, 1.4rem); line-height: 1.85; max-width: 46rem; overflow-wrap: anywhere; }
.sheet p + p { margin-top: 1.1em; }

.cta { display: flex; flex-wrap: wrap; align-items: center; gap: .8rem 1.2rem; margin-top: 1.4rem; }
.cta .hint { color: var(--muted); max-width: 30rem; }

/* ===== Respuestas ===== */
.sticky {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  margin-inline: -16px; padding: .65rem 16px;
  background: var(--paper); border-bottom: 1px solid var(--line);
}
.sticky-in { max-width: 62rem; margin-inline: auto; display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1rem; }
.sticky .prog { flex: 1 1 12rem; min-width: 0; display: grid; gap: .25rem; }
.sticky .prog b { font-variant-numeric: tabular-nums; }
.sticky .btn { min-height: 2.5rem; padding-block: .3rem; }

.fix { display: inline; }
.fix s { color: var(--pen); text-decoration-thickness: 2px; background: var(--pen-soft); border-radius: 5px; padding: 0 .2em; }
.fix b { color: var(--ok); background: var(--ok-soft); border-radius: 5px; padding: 0 .2em; margin-left: .25em; font-weight: 700; }
.fix sup {
  display: inline-grid; place-items: center; min-width: 1.35em; height: 1.35em; padding: 0 .3em;
  margin-left: .2em; border-radius: 99px; vertical-align: super;
  font: 700 .62em var(--font-body); background: var(--accent); color: var(--accent-ink);
  font-variant-numeric: tabular-nums;
}
.fix.found sup { background: var(--ok); color: var(--surface); }
.fix.missed sup { background: var(--pen); color: var(--surface); }
.fix.found { box-shadow: 0 2px 0 0 var(--ok); }
.fix.missed { box-shadow: 0 2px 0 0 var(--pen); }

.section-title { margin: 2rem 0 .3rem; font-size: 1.5rem; }
.section-sub { color: var(--muted); margin-bottom: 1rem; max-width: 40rem; }

.errs { list-style: none; margin: 0; padding: 0; display: grid; gap: .75rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 24rem), 1fr)); }
.err {
  display: grid; gap: .55rem; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: .9rem 1rem 1rem; min-width: 0;
  border-left-width: 6px;
}
.err.found { border-left-color: var(--ok); }
.err.missed { border-left-color: var(--pen); }
.err-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: .3rem .7rem; }
.err-n { font: 700 1rem var(--font-display); color: var(--muted); min-width: 1.9rem; }
.pair { display: flex; flex-wrap: wrap; align-items: baseline; gap: .15rem .55rem; font-size: 1.2rem; min-width: 0; }
.pair s { color: var(--pen); text-decoration-thickness: 2px; overflow-wrap: anywhere; }
.pair .arrow { color: var(--muted); }
.pair b { color: var(--ok); overflow-wrap: anywhere; }
.tag { margin-left: auto; font-size: .8rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: .1rem .55rem; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
.tag.p { background: var(--accent-soft); color: var(--accent); }
.why { color: var(--muted); }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
.seg button {
  min-height: 2.6rem; border-radius: 10px; border: 2px solid var(--line); background: var(--surface);
  font-weight: 700; transition: background-color .1s ease, border-color .1s ease;
}
.seg button:hover { border-color: var(--muted); }
.seg button[aria-pressed="true"].yes { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.seg button[aria-pressed="true"].no { background: var(--pen-soft); border-color: var(--pen); color: var(--pen); }

.finish { margin-top: 1.8rem; display: grid; gap: .6rem; justify-items: start; }
.finish .note { color: var(--muted); }

/* ===== Resultado ===== */
.result { display: grid; gap: 1.2rem; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.5rem 1.4rem; }
.score { font: 700 clamp(4rem, 17vw, 7rem)/1 var(--font-display); font-variant-numeric: tabular-nums; }
.score small { font-size: .4em; }
.result .big-line { font-size: 1.3rem; }
.stats { display: grid; gap: .75rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 12rem), 1fr)); }
.stat { background: var(--surface-2); border-radius: 12px; padding: .75rem .9rem; display: grid; gap: .1rem; }
.stat span { color: var(--muted); font-size: .95rem; }
.stat strong { font: 700 1.6rem var(--font-display); font-variant-numeric: tabular-nums; }
.stat.ok strong { color: var(--ok); }
.stat.bad strong { color: var(--pen); }
.review { margin: 0; padding: 0; list-style: none; display: grid; gap: .4rem; }
.review li { display: flex; flex-wrap: wrap; gap: .2rem .6rem; align-items: baseline; }
.actions { display: flex; flex-wrap: wrap; gap: .7rem; }
.msg { font-size: 1.2rem; }

@media (max-width: 520px) {
  .sheet { padding: 1.2rem 1rem 1.2rem 2.5rem; }
  .sheet::before { left: 1.6rem; }
  .card .num { font-size: 2.1rem; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>

<script>
/* Formato de cada error: [[texto con falta|forma correcta|c o p|explicación]]
   c = clásico, p = para pillar */
const EXAMS = [
{
  id: 1, nivel: 1,
  titulo: "El cumpleaños de Lucía",
  tema: "Una fiesta en familia",
  texto: `
El [[sabado|sábado|c|Es una palabra esdrújula (sá-ba-do): las esdrújulas siempre llevan tilde.]] pasado fue el [[cumple años|cumpleaños|p|Es una sola palabra: cumpleaños.]] de mi prima [[Lucia|Lucía|c|Hiato: la í es la sílaba fuerte y lleva tilde (Lu-cí-a).]] y toda la familia nos reunimos en su casa. Cuando [[llegue|llegué|c|Es una palabra aguda acabada en vocal: lleva tilde.]], [[habían|había|c|El verbo haber, cuando indica que algo existe, va siempre en singular: había globos, había muchas personas.]] globos de colores por todas partes y la mesa estaba llena de [[vocadillos|bocadillos|c|Se escribe con b, porque viene de «boca».]]. Mi tía Carmen me [[pregunto|preguntó|c|Es una palabra aguda acabada en vocal: lleva tilde.]][[; ¿quieres ayudarme a colgar la guirnalda?|: «¿Quieres ayudarme a colgar la guirnalda?»|c|Después de un verbo como «preguntó» van dos puntos, no punto y coma. La pregunta empieza con mayúscula y se pone entre comillas.]] Le dije que [[si|sí|c|Cuando se usa para decir que sí, lleva tilde.]], aunque no sabía [[como|cómo|c|Es una pregunta indirecta («cómo se hacía»): lleva tilde.]] se hacía. Mi [[tio|tío|c|Hiato: la í es la sílaba fuerte y lleva tilde.]], que es muy alto, [[tubo|tuvo|c|«Tuvo» es del verbo tener. «Tubo» es un cilindro.]] que subirse a una silla [[por que|porque|c|Para dar una causa se escribe junto y sin tilde: porque.]] yo no llegaba al techo.

A las cinco de la tarde [[llego|llegó|c|Es una palabra aguda acabada en vocal: lleva tilde.]] el pastel. Lucía [[soplo|sopló|c|Es una palabra aguda acabada en vocal: lleva tilde.]] las velas y pidió un deseo en voz baja, pero todos [[sabiamos|sabíamos|c|Hiato: la í es la sílaba fuerte y lleva tilde (sa-bí-a-mos).]] [[que|qué|c|Es una pregunta indirecta («qué había pedido»): lleva tilde.]] había pedido: un perro. [[Despues|Después|c|Es una palabra aguda acabada en -s: lleva tilde.]] abrió los regalos. Yo le [[abía|había|c|El verbo haber siempre se escribe con h.]] comprado un libro de aventuras y ella me [[dió|dio|c|Los monosílabos no llevan tilde: dio, fue, vio, fui.]] un abrazo enorme. Mi hermano pequeño, en cambio, se puso a llorar porque quería abrir también los paquetes de [[los de más|los demás|p|«Los demás» significa «los otros». «De más» significa «de sobra»: he puesto sal de más.]].

[[Ubo|Hubo|c|Es del verbo haber: lleva h.]] juegos, [[musica|música|c|Es una palabra esdrújula: siempre lleva tilde.]] y muchas risas. Jugamos al escondite y yo me [[escondi|escondí|c|Es una palabra aguda acabada en vocal: lleva tilde.]] [[detras|detrás|c|Es una palabra aguda acabada en -s: lleva tilde.]] de la cortina del [[salon|salón|c|Es una palabra aguda acabada en -n: lleva tilde.]], pero mi primo Pablo me encontró enseguida. Luego bailamos [[asta|hasta|p|«Hasta» lleva h. «Asta» es el palo de una bandera.]] que a mi madre le dolieron los pies. [[Porsupuesto|Por supuesto|c|Se escribe en dos palabras.]], no faltó la tarta de chocolate, que estaba tan rica que [[repeti|repetí|c|Es una palabra aguda acabada en vocal: lleva tilde.]] dos veces.

Al final, cuando ya era de noche, nos despedimos. Mi abuela nos dijo: «[[Volver|Volved|c|Para dar una orden a «vosotros» se usa el imperativo en -d: volved, venid, callad. El infinitivo (volver) no sirve para mandar.]] pronto, que sin vosotros la casa se queda muy callada». [[Volvi|Volví|c|Es una palabra aguda acabada en vocal: lleva tilde.]] a casa cansado pero feliz, y le prometí a Lucía que el año que viene le [[regalaria|regalaría|c|Hiato: la í es la sílaba fuerte y lleva tilde (re-ga-la-rí-a).]] el perro.
`
},
{
  id: 2, nivel: 1,
  titulo: "El partido de fútbol",
  tema: "La final del torneo del cole",
  texto: `
Ayer jugamos la final del torneo [[de el|del|c|«De» + «el» se une siempre: del.]] colegio. [[Llevabamos|Llevábamos|c|Es una palabra esdrújula: lleva tilde.]] semanas entrenando y todos estábamos muy [[nerbiosos|nerviosos|c|Se escribe con v: nervio, nervioso.]]. El entrenador nos [[reunio|reunió|c|Es una palabra aguda acabada en vocal: lleva tilde.]] en el vestuario y nos dijo: «Si [[jugais|jugáis|c|Es una palabra aguda acabada en -s: lleva tilde.]] en equipo, ganaremos. Pero [[sino|si no|c|«Si no» (dos palabras) expresa una condición: si no os ayudáis. «Sino» sirve para contraponer: no es blanco, sino negro.]] os [[ayudais|ayudáis|c|Es una palabra aguda acabada en -s: lleva tilde.]] unos a otros, perderemos». Nadie dijo nada, solo asentimos con la cabeza.

El partido [[enpezó|empezó|c|Antes de p y b siempre se escribe m: empezó, también, ambos.]] muy mal. A los [[dies|diez|c|Se escribe con z: diez.]] minutos, el delantero [[de el|del|c|«De» + «el» se une siempre: del.]] otro equipo marcó un gol y la grada se llenó de gritos. Yo me quedé quieto en la [[porteria|portería|c|Hiato: la í es la sílaba fuerte y lleva tilde (por-te-rí-a).]], sin saber [[que|qué|c|Es una pregunta indirecta («qué hacer»): lleva tilde.]] hacer. Entonces [[oi|oí|p|Hiato: la í es la sílaba fuerte y lleva tilde (o-í).]] a mi amigo Hugo, que me gritó: «¡[[Tu|Tú|c|Cuando es el pronombre personal (= tú mismo), lleva tilde. «Tu» posesivo no la lleva: tu casa.]] puedes! [[Ahora tienes que parar el siguiente!|¡Ahora tienes que parar el siguiente!|c|Las exclamaciones se abren con ¡ y se cierran con !.]]». [[Cojí|Cogí|c|El verbo coger se escribe con g: coger, cogí, cogemos.]] aire, me agaché y esperé.

En la segunda parte todo cambió. Marcamos dos goles seguidos: uno de falta y otro de cabeza. La gente [[aplaudia|aplaudía|c|Hiato: la í es la sílaba fuerte y lleva tilde (a-plau-dí-a).]], los padres saltaban y hasta el [[arbitro|árbitro|c|Es una palabra esdrújula: siempre lleva tilde.]] [[sonreia|sonreía|c|Hiato: la í es la sílaba fuerte y lleva tilde (son-re-í-a).]]. Faltaban tres minutos cuando el equipo rival lanzó un penalti. Yo no [[ví|vi|p|Los monosílabos no llevan tilde: vi, vio, fue, dio.]] el balón, pero lo paré con la punta de los dedos. No me lo podía creer.

Cuando sonó el [[silvato|silbato|c|Se escribe con b: silbar, silbato.]] final, [[hechamos|echamos|c|«Echar» (lanzar, empezar a) no lleva h. «Hecho» es del verbo hacer.]] a correr [[hacía|hacia|p|«Hacia» indica dirección y no lleva tilde. «Hacía» es del verbo hacer: hacía frío.]] el centro del campo y nos abrazamos. Ganamos dos a uno. Volvimos [[a el|al|c|«A» + «el» se une siempre: al.]] vestuario y mi madre me dijo [[despues|después|c|Es una palabra aguda acabada en -s: lleva tilde.]] que había llorado de alegría, aunque no sabe [[porqué|por qué|c|Es una pregunta indirecta: se escribe en dos palabras y con tilde. «El porqué» (junto) es un sustantivo: el motivo.]]. El entrenador nos felicitó y dijo que el trofeo era de todos, no solo de los que [[abían|habían|c|El verbo haber siempre se escribe con h.]] jugado. Esa noche no pude dormir, y [[tan poco|tampoco|c|«Tampoco» es lo contrario de «también» y se escribe en una sola palabra.]] quise hacerlo.
`
},
{
  id: 3, nivel: 1,
  titulo: "Mi primer día en el instituto",
  tema: "Tildes y signos de puntuación",
  texto: `
El [[Lunes|lunes|c|Los días de la semana se escriben con minúscula.]] 14 de [[Septiembre|septiembre|c|Los meses se escriben con minúscula.]] [[empece|empecé|c|Es una palabra aguda acabada en vocal: lleva tilde.]] primero de la ESO. Me desperté muy temprano porque estaba nervioso, y mi madre me preparó un desayuno enorme: tostadas, [[sumo|zumo|p|«Zumo» (de fruta) se escribe con z. «Sumo» significa «muy grande» o «supremo».]] y un [[baso|vaso|c|Para beber se escribe con v: vaso. «Baso» es del verbo basar.]] de leche. «Come despacio, que [[todavia|todavía|c|Hiato: la í es la sílaba fuerte y lleva tilde (to-da-ví-a).]] es pronto», me dijo. Pero yo no podía parar de pensar en el instituto.

(function () {
  "use strict";

  var NIVELES = { 1: "Fácil", 2: "Medio", 3: "Difícil" };
  var STORE_KEY = "caza-errores-v1";
  var RE = /\[\[([^|\]]+)\|([^|\]]+)\|([cp])\|([^|\]]+)\]\]/g;

  /* ---------- Datos ---------- */
  function parse(exam) {
    var errors = [];
    var paras = exam.texto.trim().split(/\n\s*\n/).map(function (p) {
      var parts = [], last = 0, m;
      RE.lastIndex = 0;
      while ((m = RE.exec(p)) !== null) {
        if (m.index > last) parts.push({ t: p.slice(last, m.index) });
        var e = { n: errors.length + 1, wrong: m[1], right: m[2], type: m[3], why: m[4] };
        errors.push(e);
        parts.push({ e: e });
        last = RE.lastIndex;
      }
      if (last < p.length) parts.push({ t: p.slice(last) });
      return parts;
    });
    return { exam: exam, paras: paras, errors: errors };
  }
  var parsed = EXAMS.map(parse);

  /* ---------- Almacenamiento (solo comodidad) ---------- */
  function loadStore() { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { return {}; } }
  function saveStore(s) { try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) { /* sin almacenamiento */ } }
  var store = loadStore();

  /* ---------- Utilidades DOM ---------- */
  var app = document.getElementById("app");
  function h(tag, attrs) {
    var el = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === "class") el.className = attrs[k];
      else if (k === "text") el.textContent = attrs[k];
      else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), attrs[k]);
      else el.setAttribute(k, attrs[k]);
    });
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c == null || c === false) continue;
      el.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    }
    return el;
  }
  function addText(parent, str) {
    str.split("\n").forEach(function (line, i) {
      if (i > 0) parent.appendChild(document.createElement("br"));
      if (line) parent.appendChild(document.createTextNode(line));
    });
  }
  function pct(n, total) { return total ? Math.round((n / total) * 100) : 0; }

  /* ---------- Estado ---------- */
  var view = "index", cur = 0, marks = {};

  function go(v, idx) {
    view = v;
    if (idx != null) cur = idx;
    if (v === "exam") marks = {};
    render();
    window.scrollTo(0, 0);
    var t = app.querySelector("h1");
    if (t) { t.setAttribute("tabindex", "-1"); t.focus({ preventScroll: true }); }
  }

  function render() {
    app.innerHTML = "";
    if (view === "index") renderIndex();
    else if (view === "exam") renderExam();
    else if (view === "answers") renderAnswers();
    else renderResult();
  }

  /* ---------- Índice ---------- */
  function renderIndex() {
    var done = 0, sum = 0;
    parsed.forEach(function (p) { var r = store[p.exam.id]; if (r) { done++; sum += r.pct; } });

    app.appendChild(h("header", { class: "hero" },
      h("h1", null, "Caza-", h("span", { class: "pen", text: "errores" })),
      h("p", { class: "lede", text: "Diez textos con faltas de ortografía escondidas. Lee con calma, apunta en un papel las que encuentres y después comprueba cuántas has cazado." })
    ));

    app.appendChild(h("ol", { class: "steps" },
      h("li", { text: "Elige un examen y lee el texto despacio." }),
      h("li", { text: "Apunta en un papel cada falta que veas." }),
      h("li", { text: "Pulsa «Ver respuestas» y marca cuáles encontraste." }),
      h("li", { text: "Mira tu total y tu porcentaje de aciertos." })
    ));

    app.appendChild(h("p", { class: "summary" },
      h("span", null, h("strong", { text: done + " de " + parsed.length }), " exámenes hechos"),

    ));

    var ul = h("ul", { class: "grid" });
    parsed.forEach(function (p, i) {

          h("span", { class: "level" }, dots, NIVELES[ex.nivel]),

        ),
        r
          ? h("span", { class: "last done" }, "Último intento: " + r.pct + " % (" + r.found + " de " + r.total + ")",
              h("span", { class: "bar-track", "aria-hidden": "true" }, h("span", { class: "bar-fill", style: "width:" + r.pct + "%" })))
          : h("span", { class: "last", text: "Sin hacer todavía" })
      );
      btn.setAttribute("aria-label", "Examen " + ex.id + ": " + ex.titulo + ". Nivel " + NIVELES[ex.nivel] + ". " + p.errors.length + " errores." + (r ? " Último intento " + r.pct + " por ciento." : ""));
      ul.appendChild(h("li", null, btn));
    });
    app.appendChild(ul);
  }

  /* ---------- Examen ---------- */
  function head(p, kicker) {
    return h("div", { class: "exam-head" },
      h("span", { class: "kicker", text: kicker }),
      h("h1", { text: p.exam.titulo }),

    );
  }

  function renderExam() {
    var p = parsed[cur];
    app.appendChild(h("div", { class: "topline" },
      h("button", { class: "link", type: "button", onclick: function () { go("index"); } }, "← Todos los exámenes")
    ));

    var sheet = h("article", { class: "sheet" });
    p.paras.forEach(function (parts) {
      var para = h("p");
      parts.forEach(function (part) { addText(para, part.t != null ? part.t : part.e.wrong); });
      sheet.appendChild(para);
    });
    app.appendChild(sheet);

    app.appendChild(h("div", { class: "cta" },
      h("button", { class: "btn big", type: "button", onclick: function () { go("answers"); } }, "Ver respuestas"),
      h("p", { class: "hint", text: "Antes de pulsar, apunta en tu papel todas las faltas que hayas encontrado." })

    refs = { fix: {}, card: {}, yes: {}, no: {} };

    var progText = h("b"), progFill = h("span", { class: "bar-fill", style: "background:var(--accent)" });
    var resultBtn = h("button", { class: "btn", type: "button", onclick: finish }, "Ver mi resultado");

      h("div", { class: "sticky-in" },
        h("div", { class: "prog" },

          h("span", { class: "bar-track", "aria-hidden": "true" }, progFill)
        ),
        resultBtn
      )
    ));

    app.appendChild(h("h2", { class: "section-title", text: "El texto corregido" }));
    app.appendChild(h("p", { class: "section-sub", text: "En rojo, lo que estaba mal. En verde, cómo se escribe. El número te lleva a la explicación de abajo." }));

    var sheet = h("article", { class: "sheet" });
    p.paras.forEach(function (parts) {
      var para = h("p");

        var e = part.e;
        var fx = h("span", { class: "fix" },

    app.appendChild(h("p", { class: "section-sub", text: "Para cada falta, marca si la encontraste en tu papel o si se te escapó. Puedes cambiarlo las veces que quieras." }));

    var ul = h("ul", { class: "errs" });
    p.errors.forEach(function (e) {
      var yes = h("button", { class: "yes", type: "button", "aria-pressed": "false", onclick: function () { setMark(e.n, true); } }, "✓ Lo encontré");
      var no = h("button", { class: "no", type: "button", "aria-pressed": "false", onclick: function () { setMark(e.n, false); } }, "✕ No lo vi");
      refs.yes[e.n] = yes; refs.no[e.n] = no;
      var card = h("li", { class: "err" },
        h("div", { class: "err-top" },
          h("span", { class: "err-n", text: "#" + e.n }),

          h("span", { class: "tag " + e.type, text: e.type === "p" ? "Para pillar" : "Clásico" })
        ),
        h("p", { class: "why", text: e.why }),
        h("div", { class: "seg", role: "group", "aria-label": "Falta " + e.n }, yes, no)
      );
      refs.card[e.n] = card;
      ul.appendChild(card);
    });
    app.appendChild(ul);

    app.appendChild(h("div", { class: "finish" },
      h("button", { class: "btn big", type: "button", onclick: finish }, "Ver mi resultado"),
      h("p", { class: "note", text: "Las faltas que no hayas marcado cuentan como «no vi»." })

  function refresh() {
    var p = parsed[cur], reviewed = 0;
    p.errors.forEach(function (e) {

      refs.fix[e.n].className = "fix" + (m === true ? " found" : m === false ? " missed" : "");
      refs.card[e.n].className = "err" + (m === true ? " found" : m === false ? " missed" : "");
      refs.yes[e.n].setAttribute("aria-pressed", String(m === true));
      refs.no[e.n].setAttribute("aria-pressed", String(m === false));
    });
    refs.progText.textContent = reviewed + " de " + p.errors.length;
    refs.progFill.style.width = pct(reviewed, p.errors.length) + "%";
  }

  function finish() {
    var p = parsed[cur];
    var found = p.errors.filter(function (e) { return marks[e.n] === true; }).length;
    var total = p.errors.length;
    store[p.exam.id] = { pct: pct(found, total), found: found, total: total };
    saveStore(store);
    go("result");
  }

  function renderResult() {

      : percent >= 50 ? "Vas por buen camino. Repasa las que se te escaparon."

    app.appendChild(h("div", { class: "topline" },

      ),

      h("p", { class: "msg", text: msg }),
      h("div", { class: "stats" },

        h("div", { class: "stat" }, h("span", { text: "Clásicas" }), h("strong", { text: byType.c[0] + " de " + byType.c[1] })),
        h("div", { class: "stat" }, h("span", { text: "Para pillar" }), h("strong", { text: byType.p[0] + " de " + byType.p[1] }))
      )
    );
    if (sin > 0) box.appendChild(h("p", { class: "why", text: "Hay " + sin + " faltas sin marcar. Cuentan como «no vi»." }));

      var ul = h("ul", { class: "errs" });
      missed.forEach(function (e) {
        ul.appendChild(h("li", { class: "err missed" },
          h("div", { class: "err-top" },
            h("span", { class: "pair" }, h("s", { text: e.wrong }), h("span", { class: "arrow", "aria-hidden": "true", text: "→" }), h("b", { text: e.right })),
            h("span", { class: "tag " + e.type, text: e.type === "p" ? "Para pillar" : "Clásico" })
          ),
          h("p", { class: "why", text: e.why })
        ));
      });

    var actions = h("div", { class: "actions" },

      h("button", { class: "btn ghost", type: "button", onclick: function () { go("index"); } }, "Elegir otro")
    );
    app.appendChild(h("div", { class: "finish" }, actions));
  }

  render();
